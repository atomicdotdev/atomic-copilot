schema = 1
agent = "copilot"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

# Copilot CLI user-level hooks (install.sh step 1b). The file is Copilot-format
# and copied verbatim; it is not an atomic-hooks merge manifest.
[[file]]
src = "hooks/atomic-hooks.json"
dst = "~/.copilot/hooks/atomic.json"
