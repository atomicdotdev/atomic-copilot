schema = 1
agent = "copilot"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[[skill]]
src = "skills/atomic-vault/SKILL.md"
dst = "~/.copilot/skills/atomic-vault/SKILL.md"

[[skill]]
src = "skills/atomic-vcs/SKILL.md"
dst = "~/.copilot/skills/atomic-vcs/SKILL.md"

[[skill]]
src = "skills/code-intelligence/SKILL.md"
dst = "~/.copilot/skills/code-intelligence/SKILL.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

# Copilot CLI user-level hooks (install.sh step 1b). The file is Copilot-format
# and copied verbatim; it is not an atomic-hooks merge manifest.
[[file]]
src = "hooks/atomic-hooks.json"
dst = "~/.copilot/hooks/atomic.json"
